<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shake Box</title>
<meta name="description" content="Shake, peek, and find the hiding balls! A number-splitting math game for kids.">
<meta name="theme-color" content="#FFF8EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">

<body>
<div class="phone" id="phone">
  <div class="deco" aria-hidden="true">
    <span style="left:24px;top:70px;font-size:34px;color:#F5C3B6;transform:rotate(-12deg)">+</span>
    <span style="left:300px;top:150px;font-size:30px;color:#B9E3D0;transform:rotate(100deg)">3</span>
    <span style="left:40px;top:250px;font-size:28px;color:#D5CAF4;transform:rotate(14deg)">=</span>
    <span style="left:346px;top:322px;font-size:36px;color:#F8DC93;transform:rotate(-8deg)">−</span>
    <span style="left:4px;top:372px;font-size:32px;color:#BDDDF5;transform:rotate(170deg)">7</span>
    <span style="left:330px;top:470px;font-size:30px;color:#F5C3B6;transform:rotate(18deg)">×</span>
    <span style="left:180px;top:52px;font-size:24px;color:#F8DC93;transform:rotate(-95deg)">5</span>
    <span style="left:20px;top:590px;font-size:30px;color:#B9E3D0;transform:rotate(185deg)">2</span>
    <span style="left:310px;top:620px;font-size:34px;color:#D5CAF4;transform:rotate(-14deg)">+</span>
    <span style="left:60px;top:740px;font-size:28px;color:#F8DC93;transform:rotate(90deg)">9</span>
    <span style="left:180px;top:770px;font-size:30px;color:#BDDDF5;transform:rotate(12deg)">=</span>
    <span style="left:300px;top:790px;font-size:28px;color:#F5C3B6;transform:rotate(-100deg)">4</span>
    <span style="left:105px;top:150px;font-size:22px;color:#D5CAF4;transform:rotate(20deg)">★</span>
    <span style="left:255px;top:560px;font-size:22px;color:#F8DC93;transform:rotate(-18deg)">★</span>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
